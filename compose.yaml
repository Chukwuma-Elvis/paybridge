services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: paybridge
      POSTGRES_USER: paybridge
      POSTGRES_PASSWORD: paybridge
    ports:
      - "5433:5432"
    volumes:
      - paybridge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paybridge -d paybridge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  paybridge-data: