# Layered on top of application.yml by @ActiveProfiles("test").
# The background timers are switched OFF so each test can run the dispatcher and the reconciler itself,
# one step at a time, and know exactly what happened.
paybridge:
  dispatcher:
    enabled: false
    max-attempts: 3
    base-delay: 0s
  reconciler:
    enabled: false
    min-age: 0s
  webhooks:
    paystack:
      secret-key: test-paystack-secret-not-a-real-key
    monnify:
      secret-key: test-monnify-secret-not-a-real-key
    partners:
      fakepartner:
        secret-key: test-partner-secret-not-a-real-key
      otherpartner:
        secret-key: test-other-partner-secret-not-real
  fx:
    refresher:
      enabled: false
  settlement:
    closer:
      enabled: false
  remittance:
    partners:
      - fakepartner
      - otherpartner
    processor:
      enabled: false
      base-delay: 0s
      payout-poll-delay: 0s
    funding:
      min-age: 0s
