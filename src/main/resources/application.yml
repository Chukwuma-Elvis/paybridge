spring:
  application:
    name: paybridge
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
  # Behind a hosting proxy the caller's real address arrives in X-Forwarded-For. This makes the web server report it, so
  # the failed-key limiter counts each caller separately instead of lumping everyone behind the proxy together.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        # Only "health" is open to everyone. "metrics" needs an admin API key (see paybridge.security below).
        include: health,metrics

logging:
  pattern:
    # Log4j2 syntax: the Logback form %X{requestId:-} makes Log4j2 look for a key literally named "requestId:-".
    correlation: "[%X{requestId}] "

paybridge:
  security:
    # API-key authentication. Leave enabled anywhere that is reachable by other people. Setting it to false lets every
    # request through unchecked, for a private developer machine only.
    enabled: true
    # The first admin key. Supply it through the environment, never write a real value in this file:
    #   PAYBRIDGE_ADMIN_API_KEY=<at least 32 characters: letters, digits, _ or ->
    # At startup its hash is registered; with it you create the other keys (POST /api/admin/api-keys).
    bootstrap-admin-key: ${PAYBRIDGE_ADMIN_API_KEY:}
    rate-limit:
      requests-per-minute: 120     # per API key, all endpoints
      transfers-per-minute: 30     # per API key, submitting transfers only
      failed-auth-per-minute: 10   # per caller address, requests carrying a key that does not exist
  dev:
    # TEST SCAFFOLDING: lets you put test naira into an account. Set to false anywhere but your own machine.
    funding-enabled: true
  compliance:
    # Transfer limits per KYC tier, in kobo (100 kobo = 1 naira). Placeholder figures for learning.
    limits:
      UNVERIFIED:
        per-transaction-minor: 5000000     # NGN 50,000
        daily-minor: 10000000              # NGN 100,000
      BASIC:
        per-transaction-minor: 20000000    # NGN 200,000
        daily-minor: 50000000              # NGN 500,000
      FULL:
        per-transaction-minor: 500000000   # NGN 5,000,000
        daily-minor: 1000000000            # NGN 10,000,000
  account:
    # Fictional 3-digit bank code used to compute the NUBAN check digit. Not a real bank.
    bank-code: "999"
  # Which payment provider sits behind TransferGateway. "fake" is the built-in simulated bank.
  # Step 11 adds "paystack".
  gateway: fake
  transfer:
    external-min-minor: 10000              # NGN 100: the smallest external transfer
    # Fee charged ON TOP of the amount for external transfers (internal transfers are free). In kobo.
    # PLACEHOLDER figures in the shape of Paystack's stepped transfer fees. Check Paystack's current pricing
    # before relying on them. The last band has no up-to-minor, so every amount has a fee.
    external-fees:
      - up-to-minor: 500000                # up to NGN 5,000
        fee-minor: 1000                    # NGN 10
      - up-to-minor: 5000000               # up to NGN 50,000
        fee-minor: 2500                    # NGN 25
      - fee-minor: 5000                    # above that: NGN 50
  dispatcher:
    enabled: true            # the postman that sends outbox transfers to the provider
    interval: 2s
    batch-size: 20
    max-attempts: 5          # after this many "could not reach the provider" tries, hand over to the reconciler
    base-delay: 2s           # wait 2s, 4s, 8s, ... between tries (capped at 5 minutes)
  reconciler:
    enabled: true            # the detective that asks the provider what happened to quiet transfers
    interval: 5s
    min-age: 10s             # only check transfers that have been quiet this long
    batch-size: 50