spring:
  application:
    name: paybridge
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
  # Behind a hosting proxy the caller's real address arrives in X-Forwarded-For. This makes the web server report it, so
  # the failed-key limiter counts each caller separately instead of lumping everyone behind the proxy together.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        # Only "health" is open to everyone. "metrics" needs an admin API key (see paybridge.security below).
        include: health,metrics

springdoc:
  # Swagger UI and the OpenAPI description. OFF unless you switch them on (SPRINGDOC_API_DOCS_ENABLED=true and
  # SPRINGDOC_SWAGGER_UI_ENABLED=true). The pages are open to everyone, but every API call made from them still needs a key.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    # Remember the key you typed into Authorize when the page is reloaded.
    persist-authorization: true

logging:
  pattern:
    # Log4j2 syntax: the Logback form %X{requestId:-} makes Log4j2 look for a key literally named "requestId:-".
    correlation: "[%X{requestId}] "

paybridge:
  security:
    # API-key authentication. Leave enabled anywhere that is reachable by other people. Setting it to false lets every
    # request through unchecked, for a private developer machine only.
    enabled: true
    # The first admin key. Supply it through the environment, never write a real value in this file:
    #   PAYBRIDGE_ADMIN_API_KEY=<at least 32 characters: letters, digits, _ or ->
    # At startup its hash is registered; with it you create the other keys (POST /api/admin/api-keys).
    bootstrap-admin-key: ${PAYBRIDGE_ADMIN_API_KEY:}
    rate-limit:
      requests-per-minute: 120     # per API key, all endpoints
      transfers-per-minute: 30     # per API key, submitting transfers only
      failed-auth-per-minute: 10   # per caller address, requests carrying a key that does not exist
    cors:
      allowed-origins: ${PAYBRIDGE_CORS_ALLOWED_ORIGINS:}
  dev:
    # TEST SCAFFOLDING: lets you put test naira into an account. Set to false anywhere but your own machine.
    funding-enabled: true
  compliance:
    # Transfer limits per KYC tier, in kobo (100 kobo = 1 naira). Placeholder figures for learning.
    limits:
      UNVERIFIED:
        per-transaction-minor: 5000000     # NGN 50,000
        daily-minor: 10000000              # NGN 100,000
      BASIC:
        per-transaction-minor: 20000000    # NGN 200,000
        daily-minor: 50000000              # NGN 500,000
      FULL:
        per-transaction-minor: 500000000   # NGN 5,000,000
        daily-minor: 1000000000            # NGN 10,000,000
  aml:
    # Anti-money-laundering (Step 17). EVERY figure is a placeholder for learning, not compliance advice.
    screening:
      review-threshold: 0.85          # name similarity at or above this needs a person, even with nothing else matching
      block-threshold: 0.95           # at or above this AND one more match (country, birth date): stop and escalate
      corroborated-review: 0.70       # lower similarity still reviewed when BOTH country and birth date match
    usd-limits:                       # US cents
      sender:
        per-transaction-minor: 500000     # USD 5,000
        daily-minor: 1000000              # USD 10,000
        monthly-minor: 5000000            # USD 50,000
      recipient:
        per-transaction-minor: 500000
        daily-minor: 1000000
        monthly-minor: 5000000
    velocity:
      window: 24h
      max-count: 5                    # this many attempts inside the window is too many
      threshold-minor: 300000         # USD 3,000: the amount people might try to stay under
      band-percent: 90                # "just under" is 90% to 100% of the threshold
      structuring-count: 3
      structuring-window: 72h
  account:
    # Fictional 3-digit bank code used to compute the NUBAN check digit. Not a real bank.
    bank-code: "999"
  # Which payment provider sits behind TransferGateway. "fake" is the built-in simulated bank.
  # Step 11 adds "paystack".
  gateway: fake
  # Real Paystack, used only when paybridge.gateway is paystack (set it with PAYBRIDGE_GATEWAY=paystack or here).
  # The key comes from the environment: PAYSTACK_SECRET_KEY=sk_test_... (TEST key first). The pk_ public key is never needed.
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
    base-url: https://api.paystack.co
    connect-timeout: 3s
    read-timeout: 10s
  transfer:
    external-min-minor: 10000              # NGN 100: the smallest external transfer
    # Fee charged ON TOP of the amount for external transfers (internal transfers are free). In kobo.
    # PLACEHOLDER figures in the shape of Paystack's stepped transfer fees. Check Paystack's current pricing
    # before relying on them. The last band has no up-to-minor, so every amount has a fee.
    external-fees:
      - up-to-minor: 500000                # up to NGN 5,000
        fee-minor: 1000                    # NGN 10
      - up-to-minor: 5000000               # up to NGN 50,000
        fee-minor: 2500                    # NGN 25
      - fee-minor: 5000                    # above that: NGN 50
  dispatcher:
    enabled: true            # the postman that sends outbox transfers to the provider
    interval: 2s
    batch-size: 20
    max-attempts: 5          # after this many "could not reach the provider" tries, hand over to the reconciler
    base-delay: 2s           # wait 2s, 4s, 8s, ... between tries (capped at 5 minutes)
  reconciler:
    enabled: true            # the detective that asks the provider what happened to quiet transfers
    interval: 5s
    min-age: 10s             # only check transfers that have been quiet this long
    batch-size: 50
  # Payment-provider webhooks (Step 12): POST /api/webhooks/{paystack|monnify}. A provider with an empty secret is switched off.
  webhooks:
    max-body-bytes: 65536
    paystack:
      secret-key: ${PAYSTACK_SECRET_KEY:}
    monnify:
      secret-key: ${MONNIFY_SECRET_KEY:}
      signature-scheme: hmac-sha512      # or sha512-secret-prefix, if real deliveries are refused (see Monnify docs)
    # Corridor partners that may tell us the sender money arrived: POST /api/webhooks/partner, signed with the partner shared secret.
    # A partner with an empty secret is switched off. The partner code is lower case, 2 to 16 letters, digits, - or _.
    partners:
      fakepartner:
        secret-key: ${FAKEPARTNER_SECRET:}
      us_partner:
        secret-key: ${US_PARTNER_SECRET:}
  # Remittance (Steps 19 to 23): USD collected abroad by a corridor partner, converted, and paid out in naira.
  remittance:
    partners:
      - fakepartner                   # partners allowed to send remittances; each also needs a webhook secret above
      - us_partner
    funding-window: 24h               # the partner must confirm the sender money within this long, or the remittance fails
    screening-gate-enabled: true      # DEVELOPMENT ONLY: false skips screening and USD limits. Never turn it off for real use.
    processor:
      enabled: true                   # the engine that converts, pays out, checks payouts and refunds
      interval: 3s
      batch-size: 20
      max-attempts: 5                 # a step that keeps failing is retried this many times, then a funded remittance is refunded
      base-delay: 5s
      payout-poll-delay: 5s
    funding:
      min-age: 30s                    # ask the partner about a remittance that has waited this long for its confirmation
  # Settlement and reconciliation (Steps 24 to 26)
  settlement:
    partners:
      - fakepartner
      - us_partner
    tolerance:
      amount-minor: 1                 # two amounts this close (in cents) count as the same
      date-days: 1                    # two dates this close count as the same day
    statement:
      max-bytes: 1048576              # the largest statement file accepted (1 MB)
      max-rows: 5000
    closer:
      enabled: true                   # the timer that cuts each partner account into batches
      interval: 1h
      lag: 2m                         # lines newer than this wait for the next batch
  # Foreign exchange (Steps 14 to 18). All figures are placeholders.
  fx:
    usd-accounts-enabled: false       # customers may not open USD accounts unless this is true
    provider: fake                    # the built-in scriptable rate source; a real source is another class behind RateProvider
    max-rate-age: 5m                  # a rate older than this is refused for new quotes
    spike-threshold-percent: 5        # a rate that jumps more than this from the last one is held for an admin
    default-spread-bps: 100           # our margin: 100 basis points = 1%
    quote-ttl: 5m                     # how long a quote stays valid
    min-rate: 100                     # a rate outside min..max is treated as a bad feed
    max-rate: 5000
    refresher:
      enabled: true
      interval: 60s
