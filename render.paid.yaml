# ==============================================================================
# Render Blueprint for PayBridge: PAID plans (alternative to render.yaml, which uses the FREE tier)
# To use this one, choose it as the Blueprint file path in the Render dashboard, or copy it over render.yaml.
# Reference: https://render.com/docs/blueprint-spec   Plans: https://render.com/docs/compute-plans
#
# One web service (built from the Dockerfile) and one Postgres database in the same region, joined over Render's
# private network. Plan IDs are Render's current CPU-and-RAM names, not the old "starter" names.
# ==============================================================================

services:
  - type: web
    name: paybridge
    runtime: docker
    # 0.5 CPU / 512 MB. This is the size the image was tested at (about 345-370 MB used, startup about 1.5 to 2.5 minutes).
    # If Render ever restarts it for running out of memory, move to 1c-2g.
    plan: 0.5c-512mb
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    # The app finishes in-flight requests on SIGTERM (server.shutdown=graceful); give it time to do so.
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: commit
    # KEEP THIS AT ONE INSTANCE. The background engines (remittance, payouts, settlement closer) run inside the app;
    # more than one copy running together has not been tested.
    numInstances: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PAYBRIDGE_SECURITY_ENABLED
        value: "true"
      - key: PAYBRIDGE_DEV_FUNDING_ENABLED
        value: "false"
      # fake = the built-in pretend bank. Change to "paystack" (and set PAYSTACK_SECRET_KEY) to use real Paystack.
      - key: PAYBRIDGE_GATEWAY
        value: fake

      # The first admin key. YOU choose it; Render prompts for it when the Blueprint is created.
      # It must be 32 or more characters of letters, digits, _ or - ONLY.
      # Do NOT use Render's generateValue here: it makes a base64 value (with + / =) and PayBridge refuses to start with it.
      # A good one:  openssl rand -hex 32
      - key: PAYBRIDGE_ADMIN_API_KEY
        sync: false

      # Database. The internal connection string contains the user and password; docker-entrypoint.sh converts it to the
      # JDBC form the Java driver needs and splits the credentials out, so nothing else is required here.
      - key: DATABASE_URL
        fromDatabase:
          name: paybridge-db
          property: connectionString

      # Optional integrations, filled in the Render Dashboard only if used. Never put real values in this file.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      # Shared secret with the corridor partner for funding webhooks. Without it the partner webhook stays switched off.
      - key: FAKEPARTNER_SECRET
        sync: false

databases:
  - name: paybridge-db
    # Smallest paid Postgres plan (0.1 CPU, 256 MB, up to 100 connections). "starter" is not a valid Postgres plan name.
    plan: 0.1c-256mb
    region: oregon
    databaseName: paybridge
    user: paybridge
    postgresMajorVersion: "17"
    # An empty list blocks all connections from the public internet; only Render services in the same region can connect.
    # (Left out, Render would allow any IP, protected by the password alone.)
    ipAllowList: []
