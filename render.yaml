# ==============================================================================
# Render Blueprint for PayBridge: FREE tier
# Reference: https://render.com/docs/blueprint-spec   Free-tier rules: https://render.com/docs/free
# The paid-plan version is render.paid.yaml.
#
# WHAT THE FREE TIER MEANS (read before deploying):
#  * The web service gets 0.1 CPU and 512 MB. It SPINS DOWN after 15 minutes without a request, and waking it takes
#    about 4 minutes for this app (measured at this size), during which requests fail. Background work (remittance
#    engine, payouts, settlement) only runs while the service is awake, and a partner or Paystack webhook that arrives
#    while it sleeps is missed. To stay awake, ping /actuator/health every 10 minutes from an external uptime monitor.
#  * Render may restart a free service at any time (4 minutes of downtime each time).
#  * The free database EXPIRES 30 days after creation (14 days of grace to upgrade, then it and its data are deleted),
#    holds 1 GB, and has NO backups. Only one free database is allowed per workspace.
#  * Render cancels a deploy that is not healthy within 15 minutes. This app starts in about 4 minutes at 0.1 CPU.
# Treat this as a sandbox for testing, not for anything you cannot lose.
# ==============================================================================

services:
  - type: web
    name: paybridge
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    # (maxShutdownDelaySeconds is not supported on free services, so Render's default shutdown time applies.)
    autoDeployTrigger: commit
    envVars:
      # Makes Java use only its fast, light compiler. At 0.1 CPU this cut start-up from about 9.4 minutes to about 4
      # and lowered memory use (measured). Not needed on paid plans.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:TieredStopAtLevel=1
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PAYBRIDGE_SECURITY_ENABLED
        value: "true"
      - key: PAYBRIDGE_DEV_FUNDING_ENABLED
        value: "false"
      # fake = the built-in pretend bank. Change to "paystack" (and set PAYSTACK_SECRET_KEY) to use real Paystack.
      - key: PAYBRIDGE_GATEWAY
        value: fake

      # The first admin key. YOU choose it; Render prompts for it when the Blueprint is created.
      # It must be 32 or more characters of letters, digits, _ or - ONLY.
      # Do NOT use Render's generateValue here: it makes a base64 value (with + / =) and PayBridge refuses to start with it.
      # A good one:  openssl rand -hex 32
      - key: PAYBRIDGE_ADMIN_API_KEY
        sync: false

      # Database. The internal connection string contains the user and password; docker-entrypoint.sh converts it to the
      # JDBC form the Java driver needs and splits the credentials out, so nothing else is required here.
      - key: DATABASE_URL
        fromDatabase:
          name: paybridge-db
          property: connectionString

      # Optional integrations, filled in the Render Dashboard only if used. Never put real values in this file.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      # Shared secret with the corridor partner for funding webhooks. Without it the partner webhook stays switched off.
      - key: FAKEPARTNER_SECRET
        sync: false

databases:
  - name: paybridge-db
    plan: free
    region: oregon
    databaseName: paybridge
    user: paybridge
    postgresMajorVersion: "17"
    # An empty list blocks all connections from the public internet; only your web service (same region) can connect.
    ipAllowList: []
